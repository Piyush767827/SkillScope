<!DOCTYPE html>
<html lang="en">
<head>

  <style>
:root {
  --ink: #20213a;
  --muted: #74758b;
  --purple: #6657e8;
  --purple-dark: #5142d2;
  --lavender: #efedff;
  --mint: #dff8ed;
  --yellow: #fff2c8;
  --pink: #ffe5ed;
  --line: #e9e8f1;
  --paper: #ffffff;
  --bg: #f8f8fc;
  --shadow: 0 16px 44px rgba(44, 39, 92, .08);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.app-shell { max-width: 1440px; min-height: 100vh; margin: 0 auto; padding: 0 5.2%; display: flex; flex-direction: column; }
.topbar { height: 82px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(226,225,237,.8); gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); font: 800 21px Manrope,sans-serif; letter-spacing: -.8px; }
.brand-mark { display: inline-flex; align-items: end; gap: 3px; width: 26px; height: 26px; padding: 5px; border-radius: 9px; background: var(--purple); }
.brand-mark span { display:block; width:4px; border-radius:5px; background:#fff; }
.brand-mark span:nth-child(1){height:8px}.brand-mark span:nth-child(2){height:14px}.brand-mark span:nth-child(3){height:10px}
.brand-mark.small { width:20px;height:20px;border-radius:7px;padding:4px;gap:2px }.brand-mark.small span{width:3px}
.main-nav { display:flex; align-items:center; gap:8px; margin-left: auto; margin-right: auto; }
.nav-link { border:0; background:transparent; color:#77788d; padding:10px 16px; border-radius:12px; font-size:14px; font-weight:700; }
.nav-link:hover,.nav-link.active { background:#eeecff; color:var(--purple); }
.top-actions { display:flex; align-items:center; gap:14px; }
.level-chip { color:#5e50d4; background:#eeecff; border-radius:30px; padding:9px 13px; font-size:12px; font-weight:800; }
.tiny-spark { font-size:15px; margin-right:3px; }
.avatar { width:37px;height:37px;border:0;border-radius:50%;background:#ffe7b8;color:#745019;font-weight:800; }
.mobile-menu { display:none; border:0;background:white;border-radius:10px;padding:9px 12px;color:var(--ink); }
#app { flex:1; min-height:600px; padding: 46px 0 70px; outline:none; }
.footer { border-top:1px solid var(--line); min-height:70px; display:flex; align-items:center; justify-content:space-between; gap:16px; color:#9696a8; font-size:12px; }
.footer-brand { display:flex;align-items:center;gap:8px;color:#55556e;font-weight:800;font-size:13px; }
.hero { display:grid;grid-template-columns: 1.08fr .92fr;align-items:center;gap:50px;padding:35px 2% 58px; }
.eyebrow { margin:0 0 15px; color:var(--purple); font-size:11px; letter-spacing:1.8px; font-weight:800; }
.hero h1 { max-width:620px; margin:0; font:800 clamp(42px,5vw,66px)/1.08 Manrope,sans-serif; letter-spacing:-3px; }
.hero h1 .accent { color:var(--purple); }
.hero-copy { color:var(--muted);font-size:17px;line-height:1.7;max-width:490px;margin:22px 0 28px; }
.button { border:0; border-radius:14px; padding:14px 21px; font-weight:800; font-size:14px; transition:.18s ease; display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none; }
.button:hover { transform:translateY(-2px); }
.primary { background:var(--purple);color:white;box-shadow:0 8px 18px rgba(102,87,232,.2); }
.primary:hover { background:var(--purple-dark); }
.secondary { background:#f0efff;color:var(--purple); }
.ghost { background:white;color:#67677e;border:1px solid var(--line); }
.full { width:100%; }
.micro-copy { color:#9696a8;font-size:12px;margin-top:15px; }
.hero-art { min-height:350px;position:relative;display:flex;align-items:center;justify-content:center; }
.art-orbit { position:absolute;width:320px;height:320px;border-radius:50%;background:#efedff; }
.art-orbit:before,.art-orbit:after { content:"";position:absolute;border:1px dashed #c9c3ff;border-radius:50%;inset:22px; }
.art-orbit:after { inset:47px;border-style:solid;opacity:.45; }
.mirror-card { position:relative;z-index:2;width:250px;height:265px;border-radius:27px;background:white;box-shadow:0 24px 60px rgba(69,57,151,.16);padding:23px;transform:rotate(-4deg); }
.mirror-top { display:flex;justify-content:space-between;align-items:center;color:#8b8aa2;font-size:10px;font-weight:800;letter-spacing:1px; }
.mirror-star { color:#ffb84d;font-size:22px; }
.mirror-face { width:105px;height:105px;margin:20px auto 14px;border-radius:35px;background:linear-gradient(145deg,#ffdca9,#ffb7c8);display:flex;align-items:center;justify-content:center;font-size:48px; }
.mirror-bars { display:flex;gap:6px;justify-content:center; }.mirror-bars i {height:6px;border-radius:10px;background:#e6e3ff;width:25px}.mirror-bars i:nth-child(2){background:#a79cff;width:37px}
.float-tag { position:absolute;z-index:3;padding:12px 15px;border-radius:14px;background:white;box-shadow:var(--shadow);font-size:12px;font-weight:800; }
.float-tag.one { top:43px;right:3%;transform:rotate(5deg); }.float-tag.two { bottom:43px;left:0;transform:rotate(-5deg); }
.float-tag span { margin-right:6px; }
.section-heading { text-align:center;margin:0 auto 26px; }.section-heading h2 {font:800 28px Manrope,sans-serif;letter-spacing:-1px;margin:0 0 8px}.section-heading p{color:var(--muted);margin:0;font-size:14px}
.steps { display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-bottom:60px; }
.step-card { background:white;border:1px solid #efedf5;border-radius:20px;padding:23px;min-height:150px; }
.step-icon { width:42px;height:42px;display:grid;place-items:center;border-radius:14px;font-size:20px;margin-bottom:15px; }
.step-card h3 {font:800 16px Manrope;margin:0 0 7px}.step-card p{font-size:13px;line-height:1.6;color:var(--muted);margin:0}
.home-bottom { border-radius:22px;background:#282745;color:white;padding:27px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px; }
.home-bottom h3 {font:800 20px Manrope;margin:0 0 5px}.home-bottom p{color:#c4c3d8;margin:0;font-size:13px}
.page-head {display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.page-head h1 {font:800 clamp(30px,4vw,42px) Manrope;letter-spacing:-1.7px;margin:0 0 7px}
.page-head p {margin:0;color:var(--muted);font-size:14px}
.stats-row {display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 28px}
.stat-card {background:white;border:1px solid var(--line);border-radius:17px;padding:18px 20px}
.stat-label {color:var(--muted);font-size:12px;font-weight:700}.stat-value {font:800 28px Manrope;margin:7px 0 2px}.stat-foot{font-size:11px;color:#a0a0b0}
.challenge-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.challenge-card {background:white;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;min-height:260px;transition:.2s}
.challenge-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.challenge-icon {width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;margin-bottom:17px}
.challenge-card h3{font:800 17px Manrope;margin:0 0 8px}.challenge-card p{font-size:13px;line-height:1.55;color:var(--muted);margin:0 0 18px;flex:1}
.card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.pill{font-size:10px;font-weight:800;padding:6px 9px;border-radius:20px;background:#f2f1f8;color:#77768d}.pill.easy{background:#e4f8ed;color:#2b8b61}.pill.medium{background:#fff2d4;color:#a56b12}
.challenge-card .button{width:100%;padding:11px}
.empty-note {background:#fff;border:1px dashed #d8d6e8;border-radius:17px;padding:25px;text-align:center;color:var(--muted)}
.challenge-layout {max-width:820px;margin:0 auto}
.back-link {border:0;background:transparent;color:var(--muted);font-weight:700;padding:0;margin-bottom:23px}
.progress-line{height:7px;background:#eae9f3;border-radius:10px;overflow:hidden;margin:16px 0 26px}.progress-line span{display:block;height:100%;background:var(--purple);border-radius:10px;transition:width .2s}
.question-card {background:white;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 10px 30px rgba(40,38,75,.04)}
.question-card h2{font:800 24px/1.3 Manrope;letter-spacing:-.7px;margin:0 0 10px}
.question-card .prompt{color:var(--muted);line-height:1.7;font-size:14px;margin:0 0 22px}
.answer-option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;cursor:pointer;transition:.15s}
.answer-option:hover{border-color:#b9b2ff;background:#faf9ff}
.answer-option.selected{border-color:var(--purple);background:#f4f2ff}
.answer-option input{accent-color:var(--purple);margin-top:3px}
.answer-option span{font-size:14px;line-height:1.5}
.text-answer{width:100%;min-height:145px;resize:vertical;border:1px solid #dfdeea;border-radius:14px;padding:15px;outline:none;line-height:1.6}
.text-answer:focus,input:focus{border-color:#9b91ff;box-shadow:0 0 0 3px #efedff}
.question-actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}
.helper{font-size:12px;color:#9696a8}
.result-wrap{max-width:800px;margin:0 auto}
.result-hero{background:#292746;color:white;border-radius:24px;padding:30px;display:grid;grid-template-columns:1fr auto;gap:25px;align-items:center}
.result-hero h1{font:800 30px Manrope;margin:0 0 8px}.result-hero p{color:#c9c8dc;margin:0;font-size:14px;line-height:1.6}
.score-ring{width:112px;height:112px;border-radius:50%;border:8px solid #8d82ff;display:grid;place-items:center;text-align:center}
.score-ring strong{font:800 29px Manrope;display:block}.score-ring span{font-size:10px;color:#d4d2f3}
.feedback-card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:15px}
.feedback-card h3{font:800 16px Manrope;margin:0 0 10px}.feedback-card p{font-size:14px;line-height:1.65;color:var(--muted);margin:0}
.rubric-row{margin-top:18px}.rubric-head{display:flex;justify-content:space-between;gap:12px;font-size:13px}.rubric-head span{font-weight:800;color:var(--purple)}.rubric-track{height:8px;background:#eeedf5;border-radius:10px;overflow:hidden;margin:8px 0}.rubric-track span{display:block;height:100%;background:var(--purple);border-radius:10px}.rubric-row p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}.rubric-card .panel-sub{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.dashboard-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:23px}
.panel h3{font:800 17px Manrope;margin:0 0 5px}.panel-sub{font-size:12px;color:var(--muted);margin:0 0 22px}
.skill-row{margin:17px 0}.skill-row-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;margin-bottom:8px}.skill-row-head span:last-child{color:var(--purple)}
.skill-track{height:9px;background:#f0eff6;border-radius:10px;overflow:hidden}.skill-track span{height:100%;display:block;background:linear-gradient(90deg,#8d82ff,#6657e8);border-radius:10px}
.activity-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0eff5}.activity-item:last-child{border:0}.activity-icon{width:36px;height:36px;border-radius:12px;background:#f0efff;display:grid;place-items:center}.activity-item strong{display:block;font-size:13px}.activity-item small{color:var(--muted);font-size:11px}
.achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.achievement{background:#faf9ff;border-radius:15px;padding:15px;text-align:center}.achievement .medal{font-size:25px}.achievement strong{display:block;font-size:12px;margin:7px 0 3px}.achievement small{font-size:10px;color:var(--muted)}
.profile-line{display:flex;align-items:center;gap:13px}.profile-big{width:52px;height:52px;border-radius:17px;background:#ffe7b8;display:grid;place-items:center;font-weight:800;font-size:21px;color:#745019}
.modal{border:0;border-radius:22px;padding:28px;width:min(420px,calc(100% - 30px));box-shadow:0 20px 80px rgba(30,25,70,.25)}.modal::backdrop{background:rgba(25,23,55,.35);backdrop-filter:blur(3px)}
.modal-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:22px}.modal h2{font:800 23px Manrope;margin:0}.modal label{font-size:13px;font-weight:800;display:block;margin-bottom:8px}.modal input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;outline:none;margin-bottom:5px}.modal .helper{margin:5px 0 20px}.icon-button{border:0;background:#f2f1f8;border-radius:50%;width:30px;height:30px;font-size:20px;color:#777}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#292746;color:white;padding:12px 18px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);z-index:10;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:850px){.app-shell{padding:0 4%}.hero{gap:20px;padding-top:20px}.hero-art{transform:scale(.9)}.challenge-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){
 .topbar{height:70px}.main-nav{display:none;position:absolute;top:65px;left:4%;right:4%;background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;padding:10px;z-index:5;flex-direction:column;align-items:stretch}.main-nav.open{display:flex}.nav-link{text-align:left}.top-actions{margin-left:auto}.level-chip{display:none}.mobile-menu{display:block}
 #app{padding:28px 0 45px;min-height:500px}.hero{grid-template-columns:1fr;text-align:center;gap:5px;padding:15px 0 38px}.hero h1{font-size:43px;letter-spacing:-2px}.hero-copy{font-size:15px;margin:18px auto 23px}.hero-art{min-height:300px;transform:scale(.88);margin-top:-10px}.art-orbit{width:285px;height:285px}.float-tag.one{right:0}.float-tag.two{left:0}
 .steps{grid-template-columns:1fr;gap:10px;margin-bottom:35px}.step-card{min-height:auto;padding:18px}.step-icon{margin-bottom:9px}.home-bottom{padding:23px;align-items:flex-start;flex-direction:column}.footer{padding:18px 0;flex-wrap:wrap;justify-content:center;text-align:center}.footer-note{width:100%}
 .page-head{align-items:flex-start;flex-direction:column}.stats-row{gap:8px}.stat-card{padding:13px}.stat-value{font-size:22px}.stat-label{font-size:10px}.challenge-grid{grid-template-columns:1fr}.challenge-card{min-height:230px}
 .question-card{padding:20px}.question-card h2{font-size:21px}.question-actions{align-items:stretch;flex-direction:column-reverse}.question-actions .button{width:100%}.result-hero{grid-template-columns:1fr;text-align:center;padding:25px}.score-ring{margin:0 auto}.dashboard-grid{grid-template-columns:1fr}.achievement-grid{grid-template-columns:repeat(3,1fr)}
}

</style>

<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" data-page="home" aria-label="SkillMirror home">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span>skillmirror</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-page="home">Home</button>
        <button class="nav-link" data-page="challenges">Challenges</button>
        <button class="nav-link" data-page="dashboard">My progress</button>
      </nav>
      <div class="top-actions">
        <span class="level-chip"><span class="tiny-spark">✦</span> <span id="nav-level">Explorer</span></span>
        <button class="avatar" id="profile-button" aria-label="Edit profile">S</button>
      </div>
      <button class="mobile-menu" id="mobile-menu" aria-label="Open menu">☰</button>
    </header>

    <main id="app" tabindex="-1">
      <!-- Rendered by app.js -->
    </main>

    <footer class="footer">
      <div class="footer-brand"><span class="brand-mark small"><span></span><span></span><span></span></span> skillmirror</div>
      <span>Small challenges. Real discoveries.</span>
      <span class="footer-note">Your progress stays on this device.</span>
    </footer>
  </div>

  <dialog id="profile-dialog" class="modal">
    <form method="dialog" id="profile-form">
      <div class="modal-head">
        <div><p class="eyebrow">YOUR SPACE</p><h2>A little about you</h2></div>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <label for="display-name">What should we call you?</label>
      <input id="display-name" name="displayName" maxlength="24" placeholder="Your name" />
      <p class="helper">This is only saved in this browser.</p>
      <button class="button primary full" value="save" id="save-profile">Save profile</button>
    </form>
  </dialog>

  <script>
/* SkillMirror — local-first interactive prototype.
   Challenge scores are practice feedback, not scientific measurements. */
const CHALLENGES = [
  {
    id: "business-rescue", title: "Save the little café", category: "Problem solving", skill: "Problem solving",
    difficulty: "Easy", time: "4 min", icon: "☕", tint: "var(--yellow)",
    description: "A neighbourhood café is losing customers. Pick a practical first move.",
    type: "choice",
    prompt: "A small café has fewer customers this month. The owner has very little money to spend. What would be the most useful first step?",
    options: [
      { text: "Ask a few regular customers what has changed and what they would like to see.", score: 4, feedback: "You start by gathering evidence from the people closest to the problem." },
      { text: "Immediately spend the budget on a large advertising campaign.", score: 1, feedback: "Promotion might help later, but spending before understanding the problem is risky." },
      { text: "Copy the menu and offers of the busiest café nearby.", score: 2, feedback: "Competitor research can be useful, but copying may miss what this café's own customers need." },
      { text: "Change the entire menu and décor at once.", score: 1, feedback: "A big change is hard to evaluate and may use money without solving the real issue." }
    ],
    strengths: "You chose to understand the problem before committing resources. That is a useful problem-solving habit.",
    improve: "Try turning what you learn into one small experiment. Make one change, observe the result, and adjust."
  },
  {
    id: "clear-explainer", title: "Explain it simply", category: "Communication", skill: "Communication",
    difficulty: "Easy", time: "5 min", icon: "💬", tint: "var(--pink)",
    description: "Make a complicated idea understandable to someone new to it.",
    type: "writing",
    prompt: "Explain what a password manager does to a 12-year-old who has never used one. Use your own words. Aim for 2–5 sentences.",
    minWords: 12,
    strengths: "You practised adapting an explanation for a specific audience. Clear communication is about making the idea easy to follow.",
    improve: "A strong explanation often uses a familiar comparison, avoids jargon, and gives one concrete example."
  },
  {
    id: "event-planner", title: "Plan a community day", category: "Planning", skill: "Planning",
    difficulty: "Medium", time: "6 min", icon: "🎪", tint: "var(--mint)",
    description: "Organise a small event with a limited budget and a short timeline.",
    type: "choice",
    prompt: "You have ₹5,000 and one week to organise a two-hour community clean-up. What should you do first?",
    options: [
      { text: "Confirm the location, permissions and number of volunteers before buying supplies.", score: 4, feedback: "You identified the dependencies that shape the rest of the plan." },
      { text: "Buy as many cleaning supplies as the budget allows.", score: 1, feedback: "Supplies matter, but you don't yet know what is needed or whether the event can happen there." },
      { text: "Design posters and spend the whole budget printing them.", score: 1, feedback: "Promotion helps attendance, but the event basics need to be confirmed first." },
      { text: "Ask everyone to arrive and decide the details on the day.", score: 2, feedback: "Being flexible can help, but unclear roles and logistics can create avoidable confusion." }
    ],
    strengths: "You put the foundations in place before spending time or money. That is a strong planning instinct.",
    improve: "Next, break the event into tasks, assign an owner to each, and set a simple deadline."
  }
];

const SKILL_NAMES = ["Problem solving", "Communication", "Planning"];
const STORAGE_KEY = "skillmirror_v1";
const defaultState = { name: "", xp: 0, completed: [], history: [], skillScores: {}, achievements: [] };
let state = loadState();
let currentChallenge = null;
let currentAnswer = null;
let currentPage = "home";

function loadState() {
  try { return { ...defaultState, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") }; }
  catch { return { ...defaultState }; }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function initials() { return (state.name.trim()[0] || "S").toUpperCase(); }
function levelName() {
  if (state.xp >= 500) return "SkillMaster";
  if (state.xp >= 300) return "Innovator";
  if (state.xp >= 180) return "Creator";
  if (state.xp >= 100) return "Thinker";
  if (state.xp >= 40) return "Discoverer";
  return "Explorer";
}
function updateChrome() {
  document.getElementById("nav-level").textContent = levelName();
  document.getElementById("profile-button").textContent = initials();
  document.querySelectorAll(".nav-link").forEach(b => b.classList.toggle("active", b.dataset.page === currentPage));
}
function setPage(page) {
  currentPage = page;
  document.querySelector(".main-nav").classList.remove("open");
  updateChrome();
  if (page === "home") renderHome();
  if (page === "challenges") renderChallenges();
  if (page === "dashboard") renderDashboard();
  document.getElementById("app").focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startChallenge(id) {
  currentChallenge = CHALLENGES.find(c => c.id === id);
  currentAnswer = null;
  renderQuestion();
}
function renderQuestion() {
  const c = currentChallenge;
  const options = c.type === "choice" ? `<div class="options">${c.options.map((o,i)=>`
    <label class="answer-option ${currentAnswer === i ? "selected" : ""}">
      <input type="radio" name="answer" value="${i}" ${currentAnswer === i ? "checked" : ""}>
      <span>${o.text}</span>
    </label>`).join("")}</div>` : `<textarea class="text-answer" id="written-answer" placeholder="Write your response here…">${escapeHTML(currentAnswer || "")}</textarea><p class="helper">A few thoughtful sentences are enough. Your response is evaluated with a simple practice rubric.</p>`;
  document.getElementById("app").innerHTML = `
    <div class="challenge-layout">
      <button class="back-link" data-action="back-challenges">← Back to challenges</button>
      <p class="eyebrow">${c.category.toUpperCase()} · ${c.time.toUpperCase()}</p>
      <h1 style="font:800 30px Manrope;margin:0">${c.title}</h1>
      <div class="progress-line"><span style="width:50%"></span></div>
      <section class="question-card">
        <p class="eyebrow">YOUR CHALLENGE</p><h2>${c.prompt}</h2>
        <p class="prompt">${c.type === "choice" ? "Choose the option you think would work best." : "There isn't one perfect answer. Focus on being clear and practical."}</p>
        ${options}
        <div class="question-actions"><span class="helper">Take your time — this is about learning.</span><button class="button primary" data-action="submit-answer">See my feedback →</button></div>
      </section>
    </div>`;
}
function evaluateWritten(text, prompt) {
  const answer = text.trim();
  const words = answer ? answer.split(/\s+/).length : 0;
  const sentences = answer.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
  const lower = answer.toLowerCase();
  const tokens = value => (value.toLowerCase().match(/[a-z0-9]+/g) || []);
  const stop = new Set("a an the and or but to of in on for with at by from is are was were be been being do does did how what why who you your their this that it its can could would should will has have had use used using explain tell show make help helps very more into about someone something".split(" "));
  const promptTerms = [...new Set(tokens(prompt).filter(w => w.length > 3 && !stop.has(w)))];
  const answerTerms = new Set(tokens(answer));
  const matchedTerms = promptTerms.filter(w => answerTerms.has(w));
  const topicRatio = promptTerms.length ? matchedTerms.length / promptTerms.length : 0;
  const reasoningCue = /\b(because|so that|therefore|this means|which means|that way|if .* then|helps? .* by|so)\b/i.test(lower);
  const exampleCue = /\b(for example|for instance|such as|imagine|like|e\.g\.|one way|could be)\b/i.test(lower);
  const analogyCue = /\b(like a|similar to|think of it as|imagine it as|just like)\b/i.test(lower);
  const hasSentenceBreaks = sentences.length >= 2;
  const hasReadableLength = words >= 20 && words <= 140;
  const hasPunctuation = /[.!?]/.test(answer);

  const relevance = topicRatio >= .38 ? 5 : topicRatio >= .25 ? 4 : topicRatio >= .14 ? 3 : topicRatio > 0 ? 2 : 1;
  const reasoning = (reasoningCue ? 2 : 0) + (words >= 28 ? 1 : 0) + (sentences.length >= 2 ? 1 : 0) + (exampleCue ? 1 : 0);
  const clarity = (hasSentenceBreaks ? 2 : 0) + (hasPunctuation ? 1 : 0) + (words >= 12 ? 1 : 0) + (words <= 100 ? 1 : 0);
  const creativity = (analogyCue ? 2 : 0) + (exampleCue ? 1 : 0) + (/\b(another|instead|different|imagine|could also|one idea|alternative)\b/i.test(lower) ? 1 : 0) + (words >= 35 ? 1 : 0);
  const clamp = n => Math.max(1, Math.min(5, n));
  const rubric = [
    { name: "Relevance", score: clamp(relevance), note: topicRatio >= .25 ? "Connects with key ideas in the challenge." : "Make the connection to the question more explicit." },
    { name: "Reasoning", score: clamp(reasoning), note: reasoningCue ? "You explain a reason or how the idea works." : "Explain why your idea works or how it helps." },
    { name: "Clarity", score: clamp(clarity), note: hasSentenceBreaks && hasPunctuation ? "Your ideas are separated into readable sentences." : "Use two or more short, complete sentences." },
    { name: "Creativity", score: clamp(creativity), note: analogyCue || exampleCue ? "You use an example or comparison to make the idea vivid." : "Try a simple analogy or a fresh, specific example." }
  ];
  const score = Math.max(1, Math.min(5, Math.round(rubric.reduce((sum, item) => sum + item.score, 0) / rubric.length)));
  const strengths = rubric.filter(item => item.score >= 4).map(item => item.name.toLowerCase());
  const needsWork = rubric.filter(item => item.score <= 2).map(item => item.name.toLowerCase());
  const feedback = strengths.length
    ? `This attempt showed strength in ${strengths.length > 1 ? strengths.slice(0, -1).join(", ") + " and " + strengths[strengths.length - 1] : strengths[0]}. ${needsWork.length ? `The next area to work on is ${needsWork.join(" and ")}.` : "Keep building on these habits."}`
    : "You've made a start. Use the rubric below to see how to make your next response more focused and developed.";
  return { score, words, rubric, feedback, topicMatches: matchedTerms.length, hasReadableLength };
}
function submitAnswer() {
  const c = currentChallenge;
  let score, feedback, detail;
  if (c.type === "choice") {
    const selected = document.querySelector('input[name="answer"]:checked');
    if (!selected) return toast("Choose an option before continuing.");
    const option = c.options[Number(selected.value)];
    score = option.score; feedback = option.feedback; detail = "You selected one of the possible approaches.";
  } else {
    const text = document.getElementById("written-answer").value;
    if (text.trim().split(/\s+/).filter(Boolean).length < (c.minWords || 12)) return toast("Add a little more detail before submitting.");
    const result = evaluateWritten(text, c.prompt);
    score = result.score;
    feedback = result.feedback;
    detail = `${result.words} words. This is an automated practice rubric based on visible writing signals, not an understanding of meaning.`;
    window.lastWrittenRubric = result.rubric;
  }
  const xp = 25;
  state.xp += xp;
  state.completed = [...new Set([...state.completed, c.id])];
  state.history.unshift({ id:c.id, title:c.title, skill:c.skill, score, date:new Date().toISOString(), xp });
  state.history = state.history.slice(0, 30);
  const previous = state.skillScores[c.skill];
  const count = (previous?.count || 0) + 1;
  state.skillScores[c.skill] = { score: Math.round((((previous?.score || 0) * (count - 1)) + score * 20) / count), count };
  if (state.completed.length >= 1 && !state.achievements.includes("first")) state.achievements.push("first");
  if (state.completed.length >= CHALLENGES.length && !state.achievements.includes("trio")) state.achievements.push("trio");
  saveState();
  renderResult({ c, score, feedback, detail, xp });
}
function renderResult({c,score,feedback,detail,xp}) {
  const percent = score * 20;
  document.getElementById("app").innerHTML = `
    <div class="result-wrap">
      <button class="back-link" data-action="back-challenges">← Back to challenges</button>
      <section class="result-hero">
        <div><p class="eyebrow" style="color:#bcb5ff">CHALLENGE COMPLETE</p><h1>Nice work${state.name ? ", "+escapeHTML(state.name.split(" ")[0]) : ""}!</h1><p>You earned ${xp} XP for giving it a go. Here's a little feedback from this attempt.</p></div>
        <div class="score-ring"><div><strong>${score}/5</strong><span>practice score</span></div></div>
      </section>
      <section class="feedback-card"><h3>✦ What went well</h3><p>${c.strengths}</p></section>
      <section class="feedback-card"><h3>🌱 One thing to try next</h3><p>${c.improve}</p></section>
      <section class="feedback-card"><h3>📝 Your attempt</h3><p>${feedback} ${detail}</p></section>
      ${c.type === "writing" && window.lastWrittenRubric ? `<section class="feedback-card rubric-card"><h3>How your answer was reviewed</h3><p class="panel-sub">Each area is scored from 1 to 5 using simple, visible writing signals.</p>${window.lastWrittenRubric.map(item => `<div class="rubric-row"><div class="rubric-head"><strong>${item.name}</strong><span>${item.score}/5</span></div><div class="rubric-track"><span style="width:${item.score * 20}%"></span></div><p>${item.note}</p></div>`).join("")}</section>` : ""}
      <p class="helper" style="margin-top:15px">Important: this first rubric is rule-based. It checks signals such as topic-word overlap, explanations, examples and sentence structure. It cannot reliably understand meaning, judge factual accuracy or recognise every valid way of answering. Treat the score as practice guidance, not a definitive judgement of your ability.</p>
      <div class="result-actions"><button class="button primary" data-page="dashboard">View my progress →</button><button class="button secondary" data-page="challenges">Try another challenge</button></div>
    </div>`;
}

  const badges = [
    {id:"first",icon:"🌟",title:"First Step",desc:"Complete your first challenge"},
    {id:"trio",icon:"🎯",title:"Curious Explorer",desc:"Try all starter challenges"}

  document.getElementById("app").innerHTML = `
    <div class="page-head"><div><p class="eyebrow">YOUR JOURNEY</p><h1>My progress</h1><p>A snapshot of what you've explored so far. Your journey, your pace.</p></div><button class="button secondary" data-page="challenges">Find a challenge →</button></div>
    <div class="stats-row">

      </section>
      <section class="panel"><h3>Recent activity</h3><p class="panel-sub">Your latest discoveries.</p>
        ${history.length ? history.slice(0,5).map(h=>`<div class="activity-item"><div class="activity-icon">✦</div><div style="flex:1"><strong>${escapeHTML(h.title)}</strong><small>${escapeHTML(h.skill)} · ${new Date(h.date).toLocaleDateString()}</small></div><span class="pill">+${h.xp} XP</span></div>`).join("") : `<div class="empty-note">Your first challenge is waiting. Complete one to see your activity here.</div>`}
      </section>
      <section class="panel" style="grid-column:1/-1"><h3>Achievements</h3><p class="panel-sub">Little milestones along the way.</p><div class="achievement-grid">
        ${badges.map(b=>`<div class="achievement" style="${state.achievements.includes(b.id)?"background:#f1efff;":"opacity:.48"}"><div class="medal">${b.icon}</div><strong>${b.title}</strong><small>${b.desc}</small></div>`).join("")}
        <div class="achievement" style="opacity:.48"><div class="medal">🌱</div><strong>Keep Growing</strong><small>More milestones coming</small></div>
      </div></section>
    </div>`;
}
function toast(message) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const el = document.createElement("div"); el.className = "toast"; el.textContent = message; document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

document.addEventListener("click", event => {
  const pageButton = event.target.closest("[data-page]");
  if (pageButton) { event.preventDefault(); setPage(pageButton.dataset.page); return; }
  const challengeButton = event.target.closest("[data-challenge]");
  if (challengeButton) { startChallenge(challengeButton.dataset.challenge); return; }
  const action = event.target.closest("[data-action]")?.dataset.action;
  if (action === "start") setPage("challenges");
  if (action === "back-challenges") setPage("challenges");
  if (action === "submit-answer") submitAnswer();
});
document.addEventListener("change", event => {
  if (event.target.name === "answer") {
    currentAnswer = Number(event.target.value);
    document.querySelectorAll(".answer-option").forEach((el,i)=>el.classList.toggle("selected",i===currentAnswer));
  }
});
document.addEventListener("input", event => {
  if (event.target.id === "written-answer") currentAnswer = event.target.value;
});
document.querySelectorAll(".nav-link").forEach(b => b.addEventListener("click", () => setPage(b.dataset.page)));
document.getElementById("mobile-menu").addEventListener("click", () => document.querySelector(".main-nav").classList.toggle("open"));
document.getElementById("profile-button").addEventListener("click", () => {
  document.getElementById("display-name").value = state.name;
  document.getElementById("profile-dialog").showModal();
});
document.getElementById("profile-form").addEventListener("submit", event => {
  if (event.submitter?.id === "save-profile") {
    state.name = document.getElementById("display-name").value.trim();
    saveState(); updateChrome(); renderHome(); toast("Profile saved on this device.");
  }
});
updateChrome();
renderHome();
